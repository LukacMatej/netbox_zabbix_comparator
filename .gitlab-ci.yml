image: ubuntu:latest

stages:
  - docker_stop

docker_stop_remote_devel:
  stage: docker_stop
  image: docker:latest
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - useradd -m gitlab-runner
    - mkdir /home/gitlab-runner/.ssh/
    - echo "ssh-rsa  gitlab-runner@martins-micu-test.netsystem.local" >> /home/gitlab-runner/.ssh/authorized_keys
    - chmod 0700 /home/gitlab-runner/.ssh/
    - chown -R gitlab-runner:gitlab-runner /home/gitlab-runner/.ssh/
    - chmod 600 /home/gitlab-runner/.ssh/authorized_keys

    # | tr -d '\r' | ssh-add -
    # - ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST >> ~/.ssh/known_hosts
    # - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Using docker ${DOCKER_HOST_SSH}"
  except:
    - tags
