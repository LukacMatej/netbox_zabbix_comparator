<div class="menu-action hostgroup-item" data-hostgroup="" style="font-style: italic;"
    hx-post="{{ url_for('select_hostgroup') }}"
    hx-vals='{"hostgroup": ""}'
    hx-ext="json-enc"
    hx-swap="none"
>&mdash; None &mdash;</div>
{% if error %}
<div class="menu-action" style="color: #b00020; cursor: default;">{{ error }}</div>
{% elif hostgroups %}
{% for hostgroup in hostgroups %}
<div class="menu-action hostgroup-item" data-hostgroup="{{ hostgroup }}"
    hx-post="{{ url_for('select_hostgroup') }}"
    hx-vals='{{ {"hostgroup": hostgroup} | tojson }}'
    hx-ext="json-enc"
    hx-swap="none"
>{{ hostgroup }}</div>
{% endfor %}
{% else %}
<div class="menu-action" style="cursor: default;">No hostgroups found</div>
{% endif %}
