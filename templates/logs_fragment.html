<div id="log-container" style="font-family: monospace; font-size: 13px; color: #d4d4d4; background: #1e1e1e; padding: 12px; height: 80vh; overflow-y: auto; white-space: pre-wrap;"></div>

<script>
    (function() {
        const container = document.getElementById("log-container");
        const evtSource = new EventSource("/logs/stream?from_start=true");

        evtSource.onmessage = (event) => {
            const line = document.createElement("div");
            line.textContent = event.data;
            container.appendChild(line);
            const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
            if (nearBottom) container.scrollTop = container.scrollHeight;
        };

        // Close the connection if this fragment gets swapped out (nav away)
        document.body.addEventListener("htmx:beforeSwap", function cleanup(e) {
            if (!document.getElementById("log-container")) {
                evtSource.close();
                document.body.removeEventListener("htmx:beforeSwap", cleanup);
            }
        });
    })();
</script>
