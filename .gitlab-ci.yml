image: docker:latest

stages:
  - lint
  - test
  - docker_rm
  - docker_build
  - publish
  - docker_stop
  - docker_copy
  - docker_run

docker_build_prod:
  stage: docker_build
  image: docker:latest
  variables:
    tag_name: ${CI_COMMIT_TAG}
  script:
    - docker build -t netsystemcz/${CI_PROJECT_NAME}:${tag_name} -f Dockerfile .
  only:
    - tags

docker_publish_prod:
  stage: publish
  variables:
    tag_name: ${CI_COMMIT_TAG}
  script:
    - docker login -u netsystemcz -p ${DOCKER_HUB_TOKEN}
    - docker push netsystemcz/${CI_PROJECT_NAME}:$tag_name
    - JOB_CONTAINER_ID=`docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=${CI_JOB_ID}"`
    - docker run --rm -t
        --volumes-from ${JOB_CONTAINER_ID}
        -e DOCKER_USER=netsystemcz
        -e DOCKER_PASS=${DOCKER_HUB_TOKEN}
        -e PUSHRM_PROVIDER=dockerhub
        -e PUSHRM_FILE=${CI_PROJECT_DIR}/README.md
        -e PUSHRM_TARGET=docker.io/netsystemcz/${CI_PROJECT_NAME}
        -e PUSHRM_DEBUG=1
        chko/docker-pushrm:1
  only:
    - tags

docker_rm_local_devel:
  stage: docker_rm
  image: docker:latest
  script:
    - echo "Using docker ${DOCKER_HOST_2}"
    - docker image rm -f netsystemcz/${CI_PROJECT_NAME}:dev || true
  except:
    - tags

docker_build_devel:
  stage: docker_build
  image: docker:latest
  script:
    - docker build -t netsystemcz/${CI_PROJECT_NAME}:dev -f Dockerfile .
  except:
    - tags

docker_stop_remote_devel:
  stage: docker_stop
  image: docker:latest
  script:
    - echo "Using docker ${DOCKER_HOST_2}"
    - DOCKER_HOST=${DOCKER_HOST_2} docker stop ${CI_PROJECT_NAME}-dev || true
    - DOCKER_HOST=${DOCKER_HOST_2} docker rm ${CI_PROJECT_NAME}-dev || true
    - DOCKER_HOST=${DOCKER_HOST_2} docker image rm -f netsystemcz/${CI_PROJECT_NAME}:dev || true
  except:
    - tags

docker_copy_devel:
  stage: docker_copy
  image: docker:latest
  script:
    - echo "Using docker ${DOCKER_HOST_2}"
    - docker login -u ${REPO_USERNAME} -p ${REPO_PASSWORD} ${REPO_HOST}
    - docker tag netsystemcz/${CI_PROJECT_NAME}:dev ${REPO_HOST}/netsystemcz/${CI_PROJECT_NAME}:dev
    - docker push ${REPO_HOST}/netsystemcz/${CI_PROJECT_NAME}:dev
    - DOCKER_HOST=${DOCKER_HOST_2} docker login -u ${REPO_USERNAME} -p ${REPO_PASSWORD} ${REPO_HOST}
    - DOCKER_HOST=${DOCKER_HOST_2} docker pull ${REPO_HOST}/netsystemcz/${CI_PROJECT_NAME}:dev
  except:
    - tags

docker_run_devel:
  stage: docker_run
  image: docker:latest
  dependencies:
    - docker_build_devel
  script:
    - echo "Using docker ${DOCKER_HOST_2}"
    - echo "${PWD}"
    - DOCKER_HOST=${DOCKER_HOST_2} docker run --detach --restart unless-stopped -p 7000:7000 --name ${CI_PROJECT_NAME}-dev -v /srv/netbox_zabbix/certs/nblab-root-ca.crt:/usr/local/share/ca-certificates/nblab-root-ca.crt:ro,z -v /srv/netbox_zabbix/certs/netsys-ca.pem:/usr/local/share/ca-certificates/netsys-ca.pem:ro,z -e LISTEN_ADDRESS=0.0.0.0 -e HTTP_PORT=7000 -e ZABBIX_IP=${ZABBIX_URL} -e ZABBIX_KEY=${ZABBIX_KEY} -e NETBOX_IP=${NETBOX_URL} -e NETBOX_KEY=${NETBOX_KEY} --network bridge_network ${REPO_HOST}/netsystemcz/${CI_PROJECT_NAME}:dev
  except:
    - tags

lint:
  stage: lint
  image: python:3.9
  before_script:
    - pip install pre-commit pylint
  script:
    - pre-commit run --all-files
  except:
    - tags

tests_devel:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m unittest discover -s tests -p 'test_*.py' -v
  except:
    - tags
