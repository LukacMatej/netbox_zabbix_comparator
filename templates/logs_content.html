<div id="logs-container">
    <h2>Application Logs</h2>
    <pre id="log-output"
         class="log-output"
         hx-get="{{ url_for('view_logs') }}"
         hx-trigger="every 2s"
         hx-swap="innerHTML"
    >{% for line in lines %}{{ line }}
{% endfor %}</pre>
</div>
<script>
    (function () {
        const el = document.getElementById('log-output');
        if (!el) { return; }
        const BOTTOM_THRESHOLD = 40;
        let stickToBottom = true;
        let savedScrollTop = 0;

        el.addEventListener('htmx:beforeSwap', function () {
            stickToBottom = el.scrollHeight - el.scrollTop - el.clientHeight < BOTTOM_THRESHOLD;
            savedScrollTop = el.scrollTop;
        });
        el.addEventListener('htmx:afterSwap', function () {
            el.scrollTop = stickToBottom ? el.scrollHeight : savedScrollTop;
        });

        el.scrollTop = el.scrollHeight;
    })();
</script>
