[mypy]
# app/ has no __init__.py files, so mypy needs to be told each subdirectory
# is its own namespace package rooted at the repo root (matches how the
# app.* imports actually resolve at runtime).
namespace_packages = True
explicit_package_bases = True
mypy_path = .

# Third-party libs here (requests, scipy, fastapi's own deps) aren't fully
# typed/stubbed; don't fail the build over that, only over our own code.
ignore_missing_imports = True

warn_unused_ignores = True
warn_redundant_casts = True
