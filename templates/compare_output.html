<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            display: flex;
            flex-direction: row;
        }
        .column {
            border-right: 1px solid black;
            flex: 33.33%;
            padding: 10px;
        }
        .column:last-child {
            border-right: none;
        }
        .header {
            font-weight: bold;
        }
        .header:first-child {
            font-size: 1.5em;
        }
        .lines {
            line-height: 2;
        }
    </style>
    <title>Comparison Output</title>
</head>
<body>
    <div class="container">
        <div class="column">
            <div class="header">Netbox Devices</div>
            <div class="lines">
                {% for device in netbox_devices %}
                    <div>{{ device }}</div>
                {% endfor %}
            </div>
        </div>
        <div class="column">
            <div class="header">Differences</div>
            <div class="lines">
                {% for difference in differences %}
                    <div>{{ difference }}</div>
                {% endfor %}
            </div>
        </div>
        <div class="column">
            <div class="header">Zabbix Devices</div>
            <div class="lines">
                {% for device in zabbix_devices %}
                    <div>{{ device }}</div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
